name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Fast, hermetic. No cluster, no credentials, no excuses for skipping.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: I8 — no mode branching outside factory.py
        run: python tools/lint_modes.py
      - name: Unit tests
        run: python -m pytest tests/unit -q

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Quorum swarm fan-out. One Lambda per agent turn, an S3 prefix for run reports,
  and a CloudWatch namespace for retry and contradiction counts.

  NOT DEPLOYED in this submission -- no AWS credentials were configured in the
  build environment. Written, reviewed, and documented as unrun in
  docs/SUBMISSION.md rather than implied to be live.

Parameters:
  BucketSuffix:
    Type: String
    Description: Suffix for the run-report bucket (must be globally unique)
  CrdbSecretArn:
    Type: String
    Description: Secrets Manager ARN holding CRDB_URL. Never an env var in plaintext.
  BedrockEmbedModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  BedrockChatModelId:
    Type: String
    Default: ""
    Description: Confirm what is actually enabled in your region before setting.

Resources:
  RunsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "quorum-runs-${BucketSuffix}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  # Least privilege, and nothing else. Bedrock invoke on two named models,
  # PutObject on ONE prefix, CloudWatch metrics in ONE namespace, and read of
  # ONE secret. No wildcards on resources except where the API requires it.
  SwarmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: quorum-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockEmbedModelId}"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${RunsBucket.Arn}/runs/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref CrdbSecretArn
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: { "cloudwatch:namespace": "Quorum" }

  AgentTurnFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: quorum-agent-turn
      Handler: handler.handler
      Runtime: python3.11
      Role: !GetAtt SwarmRole.Arn
      Timeout: 30
      MemorySize: 512
      # Each concurrent container holds its own connection pool, so keep the
      # per-container pool tiny -- fan-out multiplies it and a large pool per
      # container is how you exhaust the cluster's connection limit.
      ReservedConcurrentExecutions: 20
      Environment:
        Variables:
          QUORUM_DB: quorum
          LAMBDA_POOL_MAX: "2"
          BEDROCK_EMBED_MODEL_ID: !Ref BedrockEmbedModelId
          BEDROCK_CHAT_MODEL_ID: !Ref BedrockChatModelId
          BEDROCK_EMBED_DIM: "1024"
          S3_BUCKET: !Ref RunsBucket
          CLOUDWATCH_NAMESPACE: Quorum
          CRDB_SECRET_ARN: !Ref CrdbSecretArn
      Code:
        S3Bucket: !Sub "quorum-deploy-${BucketSuffix}"
        S3Key: quorum-lambda.zip

  ContradictionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: quorum-writes-exhausting-retries
      AlarmDescription: >
        A write exhausted its 40001 retry budget. Retries themselves are normal
        and expected; give-ups are not, and must never be silent.
      Namespace: Quorum
      MetricName: txn_give_ups
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  RunsBucketName:
    Value: !Ref RunsBucket
  FunctionArn:
    Value: !GetAtt AgentTurnFunction.Arn
